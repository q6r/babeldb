name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Core crate: the full test suite with every optional backend.
  core:
    name: core (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain (rust-toolchain.toml)
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: Build (all targets, all features)
        run: cargo build --all-targets --features lmdb,fjall,compare
      - name: Test
        run: cargo test --features lmdb,fjall

  # macOS runs when the repository is public (Actions minutes are free there;
  # a private repository pays 10x for macOS runners) or when started by hand.
  core-macos:
    name: core (macos-latest)
    if: github.event.repository.private == false || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain (rust-toolchain.toml)
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: Build (all targets, all features)
        run: cargo build --all-targets --features lmdb,fjall,compare
      - name: Test
        run: cargo test --features lmdb,fjall

  python:
    name: python binding (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
        working-directory: bindings/python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Toolchain (rust-toolchain.toml)
        run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: bindings/python
      - name: Build the wheel
        run: |
          python -m pip install --upgrade pip maturin pytest
          maturin build --release --out wheelhouse
      - name: Install the wheel and run the tests
        run: |
          python -m pip install --find-links wheelhouse --no-index babeldb
          python -m pytest -q

  node:
    name: node binding (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
        working-directory: bindings/node
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Toolchain (rust-toolchain.toml)
        run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: bindings/node
      - name: Build the addon
        run: |
          npm ci
          npx napi build --platform --release
      - name: Test
        run: npm test
